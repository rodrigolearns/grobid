buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url 'https://plugins.gradle.org/m2/'
        }
        gradlePluginPortal()
    }
    dependencies {
        classpath 'gradle.plugin.org.kt3k.gradle.plugin:coveralls-gradle-plugin:2.12.0'
        classpath "gradle.plugin.com.github.jengelman.gradle.plugins:shadow:7.0.0"
        classpath 'com.adarshr:gradle-test-logger-plugin:2.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.21"
        classpath "net.researchgate:gradle-release:3.0.2"
    }
}

// NOTE: Avoid importing Gradle/Ant/Kotlin task classes here.
// Some IDEs flag Gradle scripts with "unable to resolve class ..." even when Gradle runtime is fine.
// We use os.name/os.arch for platform detection and reflective lookup for KotlinCompile.

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri("https://plugins.gradle.org/m2/")
    }
}

def getJavaLibraryPath = {
    def jepLocalLibraries = ""
    def pathSeparator = File.pathSeparator
    def osName = System.getProperty("os.name").toLowerCase()
    def osArch = System.getProperty("os.arch")
    def isWindows = osName.contains("windows")
    def isMac = osName.contains("mac")
    def isUnix = !isWindows && !isMac

    if (isMac) {
        if ("aarch64".equals(osArch)) {
            jepLocalLibraries = "${file("./grobid-home/lib/mac_arm-64").absolutePath}"
        } else {
            jepLocalLibraries = "${file("./grobid-home/lib/mac-64").absolutePath}"
        }
    } else if (isUnix) {
        jepLocalLibraries = "${rootProject.rootDir.getAbsolutePath()}/grobid-home/lib/lin-64/jep${pathSeparator}" +
            "${rootProject.rootDir.getAbsolutePath()}/grobid-home/lib/lin-64"
    } else if (isWindows) {
        // Windows support: use win-64 or win-32 based on architecture
        def winArch = System.getProperty("os.arch").contains("64") ? "win-64" : "win-32"
        jepLocalLibraries = "${file("./grobid-home/lib/${winArch}").absolutePath}"
    } else {
        throw new RuntimeException("Unsupported platform! os.name=" + System.getProperty("os.name") + " os.arch=" + System.getProperty("os.arch"))
    }

    def javaLibraryPath = "${System.getProperty('java.library.path')}${pathSeparator}${jepLocalLibraries}"

    def envPrefix = ""
    if (System.env.CONDA_PREFIX) {
        envPrefix = "${System.env.CONDA_PREFIX}"
    } else if (System.env.VIRTUAL_ENV) {
        envPrefix = "${System.env.VIRTUAL_ENV}"
    }

    if (envPrefix) {
        // Add python/JEP native libs from activated env (if present).
        // Be defensive: Windows uses "Lib" (capital L) and doesn't have lib/pythonX.Y/ layout.
        if (System.getProperty("os.name").toLowerCase().contains("windows")) {
            def envLibs = file("${envPrefix}/Lib")
            def envSitePackagesJep = file("${envPrefix}/Lib/site-packages/jep")
            if (envLibs.exists()) {
                javaLibraryPath += "${pathSeparator}${envLibs.absolutePath}"
            }
            if (envSitePackagesJep.exists()) {
                javaLibraryPath += "${pathSeparator}${envSitePackagesJep.absolutePath}"
            }
        } else {
        def envLibs = "${envPrefix}/lib"
        def pythonDirectory = file(envLibs).listFiles({ it.toString().contains("/lib/python") } as FileFilter)?.first()
            if (pythonDirectory != null) {
        def pythonVersion = (pythonDirectory =~ /python([0-9]\.[0-9]+)/)[0][1]
                javaLibraryPath += "${pathSeparator}${envLibs}${pathSeparator}${envLibs}/python${pythonVersion}/site-packages/jep"
            } else {
                // Nothing to add (env layout didn't match expected pattern)
            }
        }
    }
    return javaLibraryPath
}

apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.8'
}


def getGitRevision() {
    def gitRevision = "unknown"
    try {
        def stdout = new ByteArrayOutputStream()
        println("Checking git under ${rootProject.rootDir}")
        exec {
            workingDir rootProject.rootDir
            commandLine 'git', 'describe', '--tags', '--always', '--first-parent'
            standardOutput = stdout
        }
        gitRevision = stdout.toString().trim()
        println "Current Git revision: ${gitRevision}"
    } catch (Exception e) {
        println "Could not get Git revision: ${e}"
    }
    return gitRevision
}

project.ext.gitRevision = getGitRevision()

// Create a task to expose the revision for other tasks
tasks.register('collectGitRevision') {
    project.ext.gitRevision = getGitRevision()
    doLast {
        println "Git revision: ${project.ext.gitRevision}"
    }
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'base'
    apply plugin: 'com.github.kt3k.coveralls'
    apply plugin: 'com.adarshr.test-logger'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'net.researchgate.release'

    group = "org.grobid"

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        // note: the following is not working
        options.compilerArgs << '-parameters'
    }
}


subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                //artifact jar 
            }
        }
        repositories {
            mavenLocal()
        }
    }

    sourceCompatibility = 1.11
    targetCompatibility = 1.11

    // Configure KotlinCompile tasks (when Kotlin plugin is applied) without a hard class reference.
    try {
        def ktCompileClass = Class.forName("org.jetbrains.kotlin.gradle.tasks.KotlinCompile")
        tasks.withType(ktCompileClass).configureEach {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11
        }
        }
    } catch (Throwable ignored) {
        // Kotlin plugin/classes not available in this context
    }

    repositories {
        mavenCentral()
        maven {
            url new File(rootProject.rootDir, "grobid-core/localLibs")
        }
        maven { url "https://jitpack.io" }
    }

    configurations {
        all*.exclude group: 'org.slf4j', module: "slf4j-log4j12"
        all*.exclude group: 'log4j', module: "log4j"
        implementation.setCanBeResolved(true)
    }

    ext {
        // treating them separately, these jars will be flattened into grobid-core.jar on installing,
        // to avoid missing dependencies from the projects that include grobid-core (see 'jar' task in grobid-core)
        localLibs = ['crfpp-1.0.2.jar',
                     'langdetect-1.1-20120112.jar',
                     'grobid-lucene-analysers-0.0.1.jar',
                     'imageio-pnm-1.0.jar',
                     'wapiti-1.5.0.jar']
    }

    dependencies {
        // packaging local libs inside grobid-core.jar
        implementation fileTree(dir: new File(rootProject.rootDir, 'grobid-core/localLibs'), include: localLibs)

        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
        testRuntimeOnly "org.junit.vintage:junit-vintage-engine"
        testImplementation(platform('org.junit:junit-bom:5.10.2'))
        testRuntimeOnly("org.junit.platform:junit-platform-launcher") {
            because("Only needed to run tests in a version of IntelliJ IDEA that bundles older versions")
        }
        testImplementation('org.junit.jupiter:junit-jupiter')
        testImplementation 'org.easymock:easymock:5.1.0'
        testImplementation "org.powermock:powermock-api-easymock:2.0.7"
        testImplementation "org.powermock:powermock-module-junit4:2.0.7"
        testImplementation "org.xmlunit:xmlunit-matchers:2.10.0"
        testImplementation "org.xmlunit:xmlunit-legacy:2.10.0"
        testImplementation "org.hamcrest:hamcrest-all:1.3"
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation "io.mockk:mockk:1.13.9"

        implementation "com.cybozu.labs:langdetect:1.1-20120112"
        implementation "com.rockymadden.stringmetric:stringmetric-core_2.11:0.27.4"
        implementation "commons-pool:commons-pool:1.6"
        implementation "commons-io:commons-io:2.14.0"
        implementation "org.apache.commons:commons-lang3:3.6"
        implementation "org.apache.commons:commons-collections4:4.1"
        implementation 'org.apache.commons:commons-text:1.11.0'
        implementation "commons-dbutils:commons-dbutils:1.7"
        implementation "com.google.guava:guava:31.0.1-jre"
        implementation "org.apache.httpcomponents:httpclient:4.5.3"
        implementation "black.ninia:jep:4.0.2"

        implementation "com.fasterxml.jackson.core:jackson-core:2.14.3"
        implementation "com.fasterxml.jackson.core:jackson-databind:2.14.3"
        implementation "com.fasterxml.jackson.module:jackson-module-afterburner:2.14.3"
        implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.14.3"
    }

    tasks.register('sourceJar', Jar) {
        description = 'A jar that contains source code'
        archiveClassifier = 'sources'
        from project.sourceSets.main.java
    }

    artifacts {
        archives sourceJar
        archives jar
    }

    test {
        useJUnitPlatform()

        testLogging.showStandardStreams = true
        // enable for having separate test executor for different tests
        forkEvery = 1
        maxHeapSize = "1024m"

        def javaLibraryPath = getJavaLibraryPath()

        if (JavaVersion.current().compareTo(JavaVersion.VERSION_1_8) > 0) {
            jvmArgs "--add-opens", "java.base/java.util.stream=ALL-UNNAMED",
                "--add-opens", "java.base/java.io=ALL-UNNAMED", "--add-opens", "java.xml/jdk.xml.internal=ALL-UNNAMED"
        }
        
        systemProperty "java.library.path", "${javaLibraryPath}"
    }
}

